{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Шанс{% endblock %}</title>
    
    <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
    body { background-color: #fff5f6; color: #4a4a4a; }
    
    header { 
        background-color: #ffffff; 
        padding: 15px 30px; 
        box-shadow: 0 4px 6px rgba(255, 182, 193, 0.3); 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
    }
    .logo { font-size: 24px; font-weight: bold; color: #ff6b8b; text-decoration: none; }
    
    /* Вот эти строчки делают меню ровным */
    nav {
        display: flex;
        gap: 20px; /* Расстояние между ссылками */
        align-items: center;
    }
    nav a { 
        text-decoration: none; 
        color: #666; 
        font-weight: 500; 
        transition: color 0.3s;
    }
    nav a:hover { color: #ff6b8b; }
</style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header>
        <a href="{% url 'pages:home' %}" class="logo">🐾 Шанс</a>
     <nav>
    <a href="{% url 'pages:home' %}">Главная</a>
    <a href="{% url 'pages:about' %}">О проекте</a>
    <a href="{% url 'pages:map' %}">Карта боксов</a>
    <a href="{% url 'pages:view' %}">Камеры</a>
    <a href="{% url 'pages:card' %}">Питомцы</a>
    <a href="{% url 'pages:pay' %}">Поддержать</a>
    <a href="{% url 'pages:profile' %}">Кабинет</a>
    <a href="{% url 'pages:registration' %}">Вход</a>
</nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

</body>
</html>
